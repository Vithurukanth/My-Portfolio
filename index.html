<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/My-Portfolio/images/vk-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script type="module" crossorigin src="/My-Portfolio/assets/index-o22uMqTx.js"></script>
    <link rel="stylesheet" crossorigin href="/My-Portfolio/assets/index-BA2pGc5L.css">
  </head>
  <body>
    <div id="error-overlay" style="position:fixed;top:0;left:0;z-index:99999;background:red;color:white;padding:20px;font-family:monospace;white-space:pre-wrap;display:none;"></div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.innerText += 'Error: ' + e.message + '\nat ' + e.filename + ':' + e.lineno + '\n\n';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('error-overlay');
        el.style.display = 'block';
        el.innerText += 'Promise Rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '\n\n';
      });
    </script>
    <div id="root"></div>
  </body>
</html>
